name: panaderia

x-server-env: &server-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Configura BETTER_AUTH_URL en .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configura BETTER_AUTH_SECRET en .env}
  BAKERY_NAME: ${BAKERY_NAME:-Panadería}
  BAKERY_TIME_ZONE: ${BAKERY_TIME_ZONE:-America/Mexico_City}
  API_PORT: 3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: dev
    command: ["npm", "run", "db:migrate"]
    environment: *server-env
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build:
      context: .
      target: dev
    environment:
      <<: *server-env
      API_HOST: 0.0.0.0
      VITE_HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-5174}
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:${WEB_PORT:-5174}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:' + process.env.API_PORT + '/readyz'),fetch('http://127.0.0.1:' + process.env.WEB_PORT + '/')]).then(r=>process.exit(r.every(x=>x.ok)?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /app/server/src
        - action: sync
          path: ./client
          target: /app/client
          ignore: [node_modules/, dist/, package.json]
        - action: sync
          path: ./packages/domain/src
          target: /app/packages/domain/src
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./server/drizzle

volumes:
  postgres_data:
